allow = ["explore", "Bash(cd \"C:\\fruit-ops\" && powershell -Command \"Get-ChildItem -Force -Filter '.git' -Directory -ErrorAction SilentlyContinue | Select-Object FullName\")", "Bash(cd \"C:\\fruit-ops\" && python -c \"\nimport openpyxl\nwb = openpyxl.load_workbook('fruit_data.xlsx', data_only=True)\nprint('Sheet 名称:', wb.sheetnames)\nfor name in wb.sheetnames:\n    ws = wb[name]\n    print(f'\\n=== {name} (行数={ws.max_row}, 列数={ws.max_column}) ===')\n    # 打印表头\n    headers = [ws.cell(1, c).value for c in range(1, ws.max_column + 1)]\n    print('表头:', headers)\n    # 打印前3行数据\n    for r in range(2, min(ws.max_row + 1, 6)):\n        row_data = [ws.cell(r, c).value for c in range(1, ws.max_column + 1)]\n        print(f'  第{r}行: {row_data}')\n\")", "Bash(pip list 2>/dev/null | grep -i -E \"lunar|zhdate|calend\" || echo \"NO_LUNAR_LIB\")", "Bash(cd \"C:\\fruit-ops\" && python server.py &\nsleep 3 && echo ready)", "Bash(cd \"C:\\\\fruit-ops\" && python -c \"\nimport openpyxl\nwb = openpyxl.load_workbook('fruit_data.xlsx', data_only=True)\nfor name in wb.sheetnames:\n    ws = wb[name]\n    print(f'=== Sheet: {name} ===')\n    print(f'Rows: {ws.max_row}, Cols: {ws.max_column}')\n    # Print header\n    headers = [cell.value for cell in ws[1]]\n    print(f'Headers: {headers}')\n    # Print first 3 data rows\n    for row in ws.iter_rows(min_row=2, max_row=min(4, ws.max_row), values_only=True):\n        print(f'  {row}')\n    print()\n\")", "Bash(cd C:\\fruit-ops && python -c \"import openpyxl; wb = openpyxl.load_workbook('fruit_data.xlsx', data_only=True); print('Sheets:', wb.sheetnames); ws = wb['水果产品库']; print(f'水果产品库: {ws.max_row-1} rows, {ws.max_column} cols'); ws2 = wb['产区映射表']; print(f'产区映射表: {ws2.max_row-1} rows, {ws2.max_column} cols'); ws3 = wb['成熟度曲线']; print(f'成熟度曲线: {ws3.max_row-1} rows, {ws3.max_column} cols'); wb.close()\")", "Bash(cd \"C:\\fruit-ops\" && python -c \"\nimport openpyxl\n\n# 读取参考文件\nwb = openpyxl.load_workbook('.reasonix/attachments/clipboard-20260718-124752.814654-000001.xlsx')\nprint('=== 参考文件 Sheets:', wb.sheetnames)\nfor sn in wb.sheetnames:\n    ws = wb[sn]\n    print(f'\\n--- Sheet: {sn} ({ws.max_row} rows x {ws.max_column} cols) ---')\n    for row in ws.iter_rows(min_row=1, max_row=min(ws.max_row, 5), values_only=False):\n        print([c.value for c in row])\n\")", "Bash(cd \"C:\\fruit-ops\" && python -c \"\nimport openpyxl\n\nwb = openpyxl.load_workbook('fruit_data.xlsx')\nprint('=== fruit_data.xlsx Sheets:', wb.sheetnames)\nfor sn in wb.sheetnames:\n    ws = wb[sn]\n    print(f'\\n--- Sheet: {sn} ({ws.max_row} rows x {ws.max_column} cols) ---')\n    # 打印表头\n    headers = [c.value for c in next(ws.iter_rows(min_row=1, max_row=1))]\n    print('Headers:', headers)\n    # 打印前5行\n    for row in ws.iter_rows(min_row=2, max_row=min(ws.max_row, 7), values_only=True):\n        print(list(row))\n\")", "Bash(cd \"C:\\fruit-ops\" && python -c \"\nimport openpyxl\n\n# 读取两个文件\nref_wb = openpyxl.load_workbook('.reasonix/attachments/clipboard-20260718-124752.814654-000001.xlsx')\nref_ws = ref_wb['农批市场']\n\nfruit_wb = openpyxl.load_workbook('fruit_data.xlsx')\nfruit_ws = fruit_wb['农批市场']\n\n# 打印参考文件所有行 重点关注坐标\nprint('=== 参考文件 农批市场 ===')\nfor i, row in enumerate(ref_ws.iter_rows(min_row=1, values_only=True), 1):\n    print(f'行{i}: {list(row)}')\n\nprint()\nprint('=== fruit_data 农批市场 坐标摘要 ===')\nfor i, row in enumerate(fruit_ws.iter_rows(min_row=1, values_only=True), 1):\n    vals = list(row)\n    lng, lat = vals[9] if len(vals) > 9 else None, vals[10] if len(vals) > 10 else None\n    if lng == 0 or lat == 0 or lng is None or lat is None:\n        print(f'行{i} 坐标缺失: ID={vals[0]}, 名称={vals[2]}, lng={lng}, lat={lat}')\n\")", "Bash(cd \"C:\\fruit-ops\" && python -c \"\nimport openpyxl\n\nwb = openpyxl.load_workbook('fruit_data.xlsx')\nws = wb['农批市场']\n\n# 统计当前坐标情况\ntotal = 0\nhas_coord = 0\nmissing = 0\nfor row in ws.iter_rows(min_row=2, values_only=True):\n    total += 1\n    lng, lat = row[9], row[10]\n    if lng and lat and (lng != 0 or lat != 0):\n        has_coord += 1\n    else:\n        missing += 1\n\nprint(f'总市场数: {total}')\nprint(f'已有坐标: {has_coord}')\nprint(f'缺失坐标: {missing}')\n\n# 列出需要补充坐标的市场详情（城市+地址用于精确调校）\nprint()\nprint('=== 需要补充坐标的市场 ===')\nfor row in ws.iter_rows(min_row=2, values_only=True):\n    lng, lat = row[9], row[10]\n    if not lng or not lat or (lng == 0 and lat == 0):\n        print(f'{row[0]} | {row[1]} | {row[2]} | {row[3]} | {row[5]}')\n\")", "Bash(cd \"C:\\fruit-ops\" && python -c \"\nimport openpyxl\n\n# 城市坐标映射表（基于城市中心精确坐标）\ncity_coords = {\n    '上海': (121.4737, 31.2304),\n    '保定': (115.4648, 38.8744),\n    '石家庄': (114.5215, 38.0428),\n    '太原': (112.5492, 37.8706),\n    '运城': (111.0069, 35.0266),\n    '呼和浩特': (111.7490, 40.8426),\n    '沈阳': (123.4328, 41.8057),\n    '长春': (125.3235, 43.8170),\n    '牡丹江': (129.6324, 44.5524),\n    '徐州': (117.1809, 34.2688),\n    '苏州': (120.5954, 31.2989),\n    '宁波': (121.5449, 29.8683),\n    '金华': (119.6476, 29.0781),\n    '芜湖': (118.4329, 31.3527),\n    '厦门': (118.0894, 24.4798),\n    '泉州': (118.5894, 24.9088),\n    '南昌': (115.8581, 28.6833),\n    '赣州': (114.9335, 25.8318),\n    '九江': (115.9998, 29.7051),\n    '青岛': (120.3826, 36.0671),\n    '烟台': (121.4479, 37.4635),\n    '临沂': (118.3564, 35.1047),\n    '洛阳': (112.4536, 34.6181),\n    '开封': (114.3070, 34.7975),\n    '宜昌': (111.2864, 30.6918),\n    '十堰': (110.7983, 32.6294),\n    '常德': (111.6985, 29.0316),\n    '东莞': (113.7518, 23.0205),\n    '佛山': (113.1214, 23.0219),\n    '柳州': (109.4284, 24.3263),\n    '桂林': (110.2900, 25.2736),\n    '海口': (110.3577, 20.0186),\n    '三亚': (109.5119, 18.2528),\n    '绵阳': (104.6796, 31.4678),\n    '南充': (106.1107, 30.8373),\n    '宜宾': (104.6433, 28.7512),\n    '贵阳': (106.6302, 26.6470),\n    '遵义': (106.9273, 27.7257),\n    '大理': (100.2676, 25.6065),\n    '玉溪': (102.5465, 24.3518),\n    '拉萨': (91.1172, 29.6500),\n    '宝鸡': (107.2377, 34.3641),\n    '渭南': (109.5102, 34.5000),\n    '兰州': (103.8343, 36.0614),\n    '天水': (105.7250, 34.5809),\n    '银川': (106.2309, 38.4872),\n    '西宁': (101.7778, 36.6171),\n    '乌鲁木齐': (87.6168, 43.8256),\n    '库尔勒': (86.1744, 41.7264),\n    '喀什': (75.9897, 39.4704),\n}\n\n# 基于详细地址的微调（相对于城市中心）\naddress_adjustments = {\n    'M002': (121.55, 31.22),      # 上海辉展，浦东新区偏东\n    'M031': (120.451, 36.389),     # 青岛即墨区\n    'M049': (110.328, 20.025),     # 海口南北水果，琼山区中山南路\n    'M018': (120.635, 31.310),     # 苏州南环桥，偏东\n}\n\nwb = openpyxl.load_workbook('fruit_data.xlsx')\nws = wb['农批市场']\n\nupdated = 0\nfor row_idx, row in enumerate(ws.iter_rows(min_row=2), 2):\n    market_id = row[0].value\n    city = row[3].value  # 城市列\n    lng_cell = row[9]\n    lat_cell = row[10]\n    \n    current_lng = lng_cell.value or 0\n    current_lat = lat_cell.value or 0\n    \n    if current_lng == 0 and current_lat == 0:\n        # 优先使用地址微调\n        if market_id in address_adjustments:\n            lng, lat = address_adjustments[market_id]\n        elif city in city_coords:\n            lng, lat = city_coords[city]\n        else:\n            print(f'WARNING: 找不到城市坐标: {market_id} {city}')\n            continue\n        \n        lng_cell.value = round(lng, 3)\n        lat_cell.value = round(lat, 3)\n        updated += 1\n        print(f'  ✓ {market_id} {city} -> lng={lng:.3f}, lat={lat:.3f}')\n\nwb.save('fruit_data.xlsx')\nprint(f'\\n共更新 {updated} 个市场的坐标')\n\")", "Bash(cd \"C:\\fruit-ops\" && python -c \"\n# -*- coding: utf-8 -*-\nimport sys\nsys.stdout.reconfigure(encoding='utf-8')\nimport openpyxl\n\ncity_coords = {\n    '上海': (121.4737, 31.2304),\n    '保定': (115.4648, 38.8744),\n    '石家庄': (114.5215, 38.0428),\n    '太原': (112.5492, 37.8706),\n    '运城': (111.0069, 35.0266),\n    '呼和浩特': (111.7490, 40.8426),\n    '沈阳': (123.4328, 41.8057),\n    '长春': (125.3235, 43.8170),\n    '牡丹江': (129.6324, 44.5524),\n    '徐州': (117.1809, 34.2688),\n    '苏州': (120.5954, 31.2989),\n    '宁波': (121.5449, 29.8683),\n    '金华': (119.6476, 29.0781),\n    '芜湖': (118.4329, 31.3527),\n    '厦门': (118.0894, 24.4798),\