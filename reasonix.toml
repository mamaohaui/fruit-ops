default_model = "deepseek/deepseek-v4-flash"
[permissions]
allow = ["explore", "Bash(cd \"C:\\fruit-ops\" && powershell -Command \"Get-ChildItem -Force -Filter '.git' -Directory -ErrorAction SilentlyContinue | Select-Object FullName\")", "Bash(cd \"C:\\fruit-ops\" && python -c \"\nimport openpyxl\nwb = openpyxl.load_workbook('fruit_data.xlsx', data_only=True)\nprint('Sheet 名称:', wb.sheetnames)\nfor name in wb.sheetnames:\n    ws = wb[name]\n    print(f'\\n=== {name} (行数={ws.max_row}, 列数={ws.max_column}) ===')\n    # 打印表头\n    headers = [ws.cell(1, c).value for c in range(1, ws.max_column + 1)]\n    print('表头:', headers)\n    # 打印前3行数据\n    for r in range(2, min(ws.max_row + 1, 6)):\n        row_data = [ws.cell(r, c).value for c in range(1, ws.max_column + 1)]\n        print(f'  第{r}行: {row_data}')\n\")", "Bash(pip list 2>/dev/null | grep -i -E \"lunar|zhdate|calend\" || echo \"NO_LUNAR_LIB\")", "Bash(cd \"C:\\fruit-ops\" && python server.py &\nsleep 3 && echo ready)", "Bash(cd \"C:\\\\fruit-ops\" && python -c \"\nimport openpyxl\nwb = openpyxl.load_workbook('fruit_data.xlsx', data_only=True)\nfor name in wb.sheetnames:\n    ws = wb[name]\n    print(f'=== Sheet: {name} ===')\n    print(f'Rows: {ws.max_row}, Cols: {ws.max_column}')\n    # Print header\n    headers = [cell.value for cell in ws[1]]\n    print(f'Headers: {headers}')\n    # Print first 3 data rows\n    for row in ws.iter_rows(min_row=2, max_row=min(4, ws.max_row), values_only=True):\n        print(f'  {row}')\n    print()\n\")"]
[[providers]]
name        = "deepseek-flash"
kind        = "openai"
base_url    = "https://api.deepseek.com"
model       = "deepseek-v4-flash"
api_key_env = "DEEPSEEK_API_KEY"
balance_url = "https://api.deepseek.com/user/balance"
context_window = 1000000
price       = { cache_hit = 0.02, input = 1, output = 2, currency = "¥" }

