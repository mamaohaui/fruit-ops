_cell.value = round(lat, 3)\n        updated += 1\n        print(f'  OK {market_id} {city} -> lng={lng:.3f}, lat={lat:.3f}')\n\nwb.save('fruit_data.xlsx')\nprint(f'\\nTotal updated: {updated}')\n\")", "Bash(cd \"C:\\fruit-ops\" && python -c \"\nimport sys\nsys.stdout.reconfigure(encoding='utf-8')\nimport openpyxl\n\nwb = openpyxl.load_workbook('fruit_data.xlsx')\nws = wb['农批市场']\n\nfor row in ws.iter_rows(min_row=2, values_only=True):\n    lng, lat = row[9] or 0, row[10] or 0\n    if lng == 0 and lat == 0:\n        print(f'{row[0]} | province={row[1]} | city={repr(row[3])} | name={row[2]} | addr={row[5]}')\n\")", "Bash(cd \"C:\\fruit-ops\" && python -c \"\nimport sys\nsys.stdout.reconfigure(encoding='utf-8')\nimport openpyxl\n\ncity_coords = {\n    '上海': (121.4737, 31.2304),\n    '保定': (115.4648, 38.8744),\n    '石家庄': (114.5215, 38.0428),\n    '太原': (112.5492, 37.8706),\n    '运城': (111.0069, 35.0266),\n    '呼和浩特': (111.7490, 40.8426),\n    '大连': (121.615, 38.914),\n    '长春': (125.3235, 43.8170),\n    '齐齐哈尔': (123.957, 47.354),\n    '常州': (119.974, 31.811),\n    '苏州': (120.5954, 31.2989),\n    '宁波': (121.5449, 29.8683),\n    '金华': (119.6476, 29.0781),\n    '芜湖': (118.4329, 31.3527),\n    '厦门': (118.0894, 24.4798),\n    '泉州': (118.5894, 24.9088),\n    '南昌': (115.8581, 28.6833),\n    '赣州': (114.9335, 25.8318),\n    '九江': (115.9998, 29.7051),\n    '青岛': (120.3826, 36.0671),\n    '烟台': (121.4479, 37.4635),\n    '临沂': (118.3564, 35.1047),\n    '洛阳': (112.4536, 34.6181),\n    '开封': (114.3070, 34.7975),\n    '宜昌': (111.2864, 30.6918),\n    '十堰': (110.7983, 32.6294),\n    '常德': (111.6985, 29.0316),\n    '东莞': (113.7518, 23.0205),\n    '佛山': (113.1214, 23.0219),\n    '柳州': (109.4284, 24.3263),\n    '玉林': (110.181, 22.654),\n    '海口': (110.3577, 20.0186),\n    '三亚': (109.5119, 18.2528),\n    '绵阳': (104.6796, 31.4678),\n    '南充': (106.1107, 30.8373),\n    '宜宾': (104.6433, 28.7512),\n    '贵阳': (106.6302, 26.6470),\n    '遵义': (106.9273, 27.7257),\n    '大理': (100.2676, 25.6065),\n    '玉溪': (102.5465, 24.3518),\n    '拉萨': (91.1172, 29.6500),\n    '咸阳': (108.709, 34.329),\n    '渭南': (109.5102, 34.5000),\n    '兰州': (103.8343, 36.0614),\n    '天水': (105.7250, 34.5809),\n    '银川': (106.2309, 38.4872),\n    '西宁': (101.7778, 36.6171),\n    '乌鲁木齐': (87.6168, 43.8256),\n    '库尔勒': (86.1744, 41.7264),\n    '喀什': (75.9897, 39.4704),\n}\n\n# 基于详细地址的微调\naddress_adjustments = {\n    'M002': (121.550, 31.220),     # 上海辉展，浦东新区\n    'M031': (120.451, 36.389),     # 青岛即墨区\n    'M049': (110.328, 20.025),     # 海口南北水果，琼山区\n    'M018': (120.635, 31.310),     # 苏州南环桥\n}\n\ndef match_city(city_name):\n    for suffix in ['市', '地区', '自治州', '县']:\n        if city_name.endswith(suffix):\n            return city_name[:-len(suffix)]\n    return city_name\n\nwb = openpyxl.load_workbook('fruit_data.xlsx')\nws = wb['农批市场']\n\nupdated = 0\nwarnings = []\nfor row_idx, row in enumerate(ws.iter_rows(min_row=2), 2):\n    market_id = row[0].value\n    city = row[3].value\n    lng_cell = row[9]\n    lat_cell = row[10]\n    \n    current_lng = lng_cell.value or 0\n    current_lat = lat_cell.value or 0\n    \n    if current_lng == 0 and current_lat == 0:\n        if market_id in address_adjustments:\n            lng, lat = address_adjustments[market_id]\n        else:\n            key = match_city(city)\n            if key in city_coords:\n                lng, lat = city_coords[key]\n            else:\n                warnings.append(f'{market_id} {city} (key={key})')\n                continue\n        \n        lng_cell.value = round(lng, 3)\n        lat_cell.value = round(lat, 3)\n        updated += 1\n        print(f'  {market_id} {city} -> ({lng:.3f}, {lat:.3f})')\n\nif warnings:\n    print('\\nWARNINGS:')\n    for w in warnings:\n        print(f'  {w}')\n\nwb.save('fruit_data.xlsx')\nprint(f'\\nTotal updated: {updated}')\n\")", "Bash(cd \"C:\\fruit-ops\" && python -c \"\nimport sys\nsys.stdout.reconfigure(encoding='utf-8')\nimport openpyxl\n\nwb = openpyxl.load_workbook('fruit_data.xlsx')\nws = wb['农批市场']\n\ntotal = 0\nok = 0\nzero = 0\n\nprint('=== 坐标验证 ===')\nfor row in ws.iter_rows(min_row=2, values_only=True):\n    total += 1\n    mid, prov, name, city = row[0], row[1], row[2], row[3]\n    lng, lat = row[9], row[10]\n    if lng and lat and lng != 0 and lat != 0:\n        ok += 1\n    else:\n        zero += 1\n        print(f'  MISSING: {mid} {name} ({city}) lng={lng} lat={lat}')\n\nprint(f'\\n总市场数: {total}')\nprint(f'有坐标:   {ok}')\nprint(f'缺坐标:   {zero}')\nprint(f'覆盖率:   {ok/total*100:.1f}%')\n\")", "Bash(cd \"C:\\fruit-ops\" && python -c \"\nimport sys\nsys.stdout.reconfigure(encoding='utf-8')\nimport openpyxl\n\nwb = openpyxl.load_workbook('fruit_data.xlsx')\nws = wb['农批市场']\n\n# 抽查：验证几个有详细地址的坐标是否合理\nchecks = ['M006','M012','M049','M050','M068','M070']\nfor row in ws.iter_rows(min_row=2, values_only=True):\n    if row[0] in checks:\n        print(f'{row[0]} | {row[1]} | {row[2]:30s} | {row[3]} | lng={row[9]:.3f} lat={row[10]:.3f} | {row[5]}')\n\")", "Bash(cd \"C:\\\\fruit-ops\" && python -c \"\nimport openpyxl\n\n# 读取水果产地数据表 (附件1)\nwb1 = openpyxl.load_workbook('.reasonix/attachments/clipboard-20260718-154536.448270-000002.xlsx')\nprint('=== 附件1: 水果产地数据表 ===')\nprint('Sheet names:', wb1.sheetnames)\nfor sname in wb1.sheetnames:\n    ws = wb1[sname]\n    print(f'\\n--- Sheet: {sname} ---')\n    print(f'Rows: {ws.max_row}, Cols: {ws.max_column}')\n    for row in ws.iter_rows(min_row=1, max_row=min(5, ws.max_row), values_only=False):\n        print([c.value for c in row])\n    print('...')\n\n# 读取附件2 (fruit_data 对比文件)\nwb2 = openpyxl.load_workbook('.reasonix/attachments/clipboard-20260718-154605.353809-000003.xlsx')\nprint('\\n=== 附件2: fruit_data 对比文件 ===')\nprint('Sheet names:', wb2.sheetnames)\nfor sname in wb2.sheetnames:\n    ws = wb2[sname]\n    print(f'\\n--- Sheet: {sname} ---')\n    print(f'Rows: {ws.max_row}, Cols: {ws.max_column}')\n    for row in ws.iter_rows(min_row=1, max_row=min(5, ws.max_row), values_only=False):\n        print([c.value for c in row])\n    print('...')\n\n# 读取项目中的 fruit_data.xlsx\nwb3 = openpyxl.load_workbook('fruit_data.xlsx')\nprint('\\n=== 项目 fruit_data.xlsx ===')\nprint('Sheet names:', wb3.sheetnames)\nfor sname in wb3.sheetnames:\n    ws = wb3[sname]\n    print(f'\\n--- Sheet: {sname} ---')\n    print(f'Rows: {ws.max_row}, Cols: {ws.max_column}')\n    for row in ws.iter_rows(min_row=1, max_row=min(5, ws.max_row), values_only=False):\n        print([c.value for c in row])\n    print('...')\n\")", "Bash(cd \"C:\\\\fruit-ops\" && python -c \"\nimport openpyxl, sys, io\nsys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8')\n\nwb1 = openpyxl.load_workbook('.reasonix/attachments/clipboard-20260718-154536.448270-000002.xlsx')\nprint('=== Attachment 1: fruit origin data ===')\nprint('Sheets:', wb1.sheetnames)\nfor sname in wb1.sheetnames:\n    ws = wb1[sname]\n    print(f'\\n--- Sheet: {sname} (rows={ws.max_row}, cols={ws.max_column}) ---')\n    for i, row in enumerate(ws.iter_rows(min_row=1, max_row=min(3, ws.max_row), values_only=True)):\n        print(f'  Row {i+1}: {list(row)}')\n\")", "Bash(cd \"C:\\\\fruit-ops\" && python -c \"\nimport openpyxl, sys, io\nsys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8')\n\nwb2 = openpyxl.load_workbook('.reasonix/attachments/clipboard-20260718-154605.353809-000003.xlsx')\nprint('=== Attachment 2: comparison file ===')\nprint('Sheets:', wb2.sheetnames)\nfor sname in wb2.sheetnames:\n    ws = wb2[sname]\n    print(f'\\n--- Sheet: {sname} (rows={ws.max_row}, cols={ws.max_column}) ---')\n    for i, row in enumerate(ws.iter_rows(min_row=1, max_row=min(4, ws.max_row), values_only=True)):\n        print(f'  Row {i+1}: {list(row)}')\n\")", "Bash(cd \"C:\\\\fruit-ops\" && python -c \"\nimport openpyxl, sys, io\nsys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8')\n\nwb3 = openpyxl.load_workbook('fruit_data.xlsx')\nprint('=== Project fruit_data.xlsx ===')\nprint('Sheets:', wb3.sheetnames)\nfor sname in wb3.sheetnames:\n    ws = wb3[sname]\n    print(f'\\n--- Sheet: {sname} (rows={ws.max_row}, cols={ws.max_column}) ---')\n    for i, row in enumerate(ws.iter_rows(min_row=1, max_row=min(4, ws.max_row), values_only=True)):\n        print(f'  Row {i+1}: {list(row)}')\n\")", "Bash(cd \"C:\\\\fruit-ops\" && python -c \"\nimport openpyxl, sys, io\nsys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8')\n\n# Read Attachment 1 - fruit origin data\nwb1 = openpyxl.load_workbook('.reasonix/attachments/clipboard-20260718-154536.448270-000002.xlsx')\n\n# Sheets: 西南, 华南, 西北, 华中, 华东, 华北, 东北, 哈密瓜, 荔枝\nregion_sheets = ['西南地区', '华南地区', '西北地区', '华中地区', '华东地区', '华北地区', '东北地区']\n\nall_origin_items = []\n\nfor sname in region_sheets:\n    ws = wb1[sname]\n    for row in ws.iter_rows(min_row=2, max_row=ws.max_row, values_only=True):\n        if row[0] and row[1] and row[2]:  # category, province, variety\n            all_origin_items.append({\n                'sheet': sname,\n                'category': str(row[0]).strip(),\n                'province': str(row[1]).strip(),\n                'variety': str(row[2]).strip(),\n                'area': str(row[3]).strip() if row[3] else '',\n                'season': str(row[4]).strip() if row[4] else '',\n                'notes': str(row[5]).strip() if row[5] else ''\n            })\n\n# Also read 哈密瓜 sheet\nws_hmg = wb1['哈密瓜']\nfor row in ws_hmg.iter_rows(min_row=2, max_row=ws_hmg.max_row, values_only=True):\n    if row[0] and row[2]:\n        all_origin_items.append({\n            'sheet': '哈密瓜',\n            'category': '哈密瓜',\n            'province': str(row[0]).strip(),\n            'variety': str(row[2]).strip(),\n            'area': str(row[1]).strip() if row[1] else '',\n            'season': str(row[3]).strip() if row[3] else '',\n            'notes': str(row[4]).strip() if row[4] else ''\n        })\n\n# Also read 荔枝 sheet\nws_lz = wb1['荔枝']\nfor row in ws_lz.iter_rows(min_row=2, max_row=ws_lz.max_row, values_only=True):\n    if row[0] and row[2]:\n        all_origin_items.append({\n            'sheet': '荔枝',\n            'category': '荔枝',\n            'province': str(row[0]).strip(),\n            'variety': str(row[2]).strip(),\n            'area': str(row[1]).strip() if row[1] else '',\n            'season': str(row[4]).strip() if row[4] else '',\n            'notes': str(row[5]).strip() if row[5] else ''\n        })\n\nprint(f'Total origin items: {len(all_origin_items)}')\nprint()\nfor item in all_origin_items:\n    print(f\\\"[{item['sheet']}] {item['category']} | {item['province']} | {item['variety']} | {item['area'][:40]} | {item['season'][:30]}\\\")\n\")", "Bash(cd \"C:\\\\fruit-ops\" && python -c \"\nimport openpyxl, sys, io\nsys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8')\n\n# Read fruit_data.xlsx '水果产品库'\nwb = openpyxl.load_workbook('fruit_data.xlsx')\nws = wb['水果产品库']\n\nfruit_data_names = set()\nfruit_data_details = {}\n\nfor row in ws.iter_rows(min_row=2, max_row=ws.max_row, values_only=True):\n    fid = row[0]\n    name = str(row[1]).strip() if row[1] else ''\n    category = str(row[2]).strip() if row[2] else ''\n    province = str(row[3]).strip() if row[3] else ''\n    city = str(row[4]).strip() if row[4] else ''\n    county = str(row[5]).strip() if row[5] else ''\n    \n    fruit_data_names.add(name)\n    fruit_data_details[name] = {\n        'id': fid, 'name': name, 'category': category,\n        'province': province, 'city': city, 'county': county\n    }\n\nprint(f'fruit_data.xlsx has {len(fruit_data_names)} unique fruit names')\nprint()\nprint('All fruit names in fruit_data:')\nfor name in sorted(fruit_data_names):\n    d = fruit_data_details.get(name, {})\n    print(f\\\"  [{d.get('id','')}] {name} ({d.get('category','')} | {d.get('province','')}-{d.get('city','')}-{d.get('county','')})\\\")\n\")", "Bash(cd \"C:\\\\fruit-ops\" && python -c \"\nimport openpyxl, sys, io, re\nsys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8')\n\n# 1. Load fruit_data names with province context\nwb = openpyxl.load_workbook('fruit_data.xlsx')\nws = wb['水果产品库']\n\nfd_list = []\nfd_names = {}\nfor row in ws.iter_rows(min_row=2, max_row=ws.max_row, values_only=True):\n    name = str(row[1]).strip() if row[1] else ''\n    province = str(row[3]).strip() if row[3] else ''\n    fd_list.append({'name': name, 'province': province, 'id': row[0]})\n    fd_names[name] = province\n\n# 2. Load attachment 1\nwb1 = openpyxl.load_workbook('.reasonix/attachments/clipboard-20260718-154536.448270-000002.xlsx')\nregion_sheets = ['西南地区', '华南地区', '西北地区', '华中地区', '华东地区', '华北地区', '东北地区']\n\norigin_items = []\nfor sname in region_sheets:\n    ws = wb1[sname]\n    for row in ws.iter_rows(min_row=2, max_row=ws.max_row, values_only=True):\n        if row[0] and row[1] and row[2]:\n            origin_items.append({\n                'sheet': sname,\n                'category': str(row[0]).strip(),\n                'province': str(row[1]).strip(),\n                'variety': str(row[2]).strip(),\n                'area': str(row[3]).strip() if row[3] else '',\n                'season': str(row[4]).strip() if row[4] else '',\n                'notes': str(row[5]).strip() if row[5] else ''\n            })\n\n# Also Hami melon & Lychee\nfor sname in ['哈密瓜', '荔枝']:\n    ws = wb1[sname]\n    for row in ws.iter_rows(min_row=2, max_row=ws.max_row, values_only=True):\n        cat = '哈密瓜' if sname == '哈密瓜' else '荔枝'\n        if sname == '哈密瓜':\n            if row[0] and row[2]:\n                origin_items.append({\n                    'sheet': sname, 'category': cat,\n                    'province': str(row[0]).strip(),\n                    'variety': str(row[2]).strip(),\n                    'area': str(row[1]).strip() if row[1] else '',\n                    'season': str(row[3]).strip() if row[3] else '',\n                    'notes': str(row[4]).strip() if row[4] else ''\n                })\n        else:\n            if row[0] and row[2]:\n                origin_items.append({\n                    'sheet': sname, 'category': cat,\n                    'province': str(row[0]).strip(),\n                    'variety': str(row[2]).strip(),\n                    'area': str(row[1]).strip() if row[1] else '',\n                    'season': str(row[4]).strip() if row[4] else '',\n                    'notes': str(row[5]).strip() if row[5] else ''\n                })\n\n# Normalize province names\ndef norm_prov(p):\n    p = p.replace('省', '').replace('市', '').replace('自治区', '').replace('壮族','').replace('回族','').replace('维吾尔','').strip()\n    return p\n\n# Build a set of fd (name + province) pairs\nfd_pairs = set()\nfd_name_only = {}\nfor item in fd_list:\n    fd_pairs.add((item['name'], norm_prov(item['province'])))\n    if item['name'] not in fd_name_only:\n        fd_name_only[item['name']] = norm_prov(item['province'])\n\n# Now compare\nmatched = []\nnot_matched = []\n\nfor item in origin_items:\n    variety = item['variety']\n    province = item['province']\n    nprov = norm_prov(province)\n    \n    # Try exact match: variety == fd name\n    found = False\n    \n    # 1. Exact variety match in fd_names (ignoring province)\n    if variety in fd_names:\n        found = True\n        matched.append((variety, province, 'exact_name', fd_names[variety]))\n    else:\n        # 2. Try partial: variety contains fd name or fd name contains variety\n        for fdname, fdprov in fd_names.items():\n            if fdname in variety or variety in fdname:\n                found = True\n                matched.append((variety, province, f'partial({fdname})', fdprov))\n                break\n    \n    if not found:\n        # 3. Try word-level matching after removing common words\n        # Strip numbers, special chars from variety\n        clean_v = re.sub(r'[（）()\\d\\u00b2\\u00b3、，, ]+', '', variety)\n        for fdname, fdprov in fd_names.items():\n            clean_f = re.sub(r'[（）()\\d\\u00b2\\u00b3、，, ]+', '', fdname)\n            if clean_v == clean_f or (len(clean_v) >= 2 and len(clean_f) >= 2 and (clean_v in clean_f or clean_f in clean_v)):\n                found = True\n                matched.append((variety, province, f'fuzzy({fdname})', fdprov))\n                break\n    \n    if not found:\n        not_matched.append(item)\n\nprint(f'Total origin items: {len(origin_items)}')\nprint(f'Matched: {len(matched)}')  \nprint(f'NOT matched: {len(not_matched)}')\nprint()\nprint('=== ITEMS NOT IN fruit_data.xlsx ===')\nfor item in not_matched:\n    print(f\\\"  [{item['sheet']}] {item['category']} | {item['province']} | {item['variety']}\\\")\n    print(f\\\"       Area: {item['area'][:60]}\\\")\n    print(f\\\"       Season: {item['season'][:40]}\\\")\n\")", "Bash(cd \"C:\\\\fruit-ops\" && python -c \"\nimport openpyxl, sys, io, re\nsys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8')\n\n# 1. Load fruit_data names\nwb = openpyxl.load_workbook('fruit_data.xlsx')\nws = wb['水果产品库']\n\nfd_names = {}  # name -> province\nfd_names_lower = {}  # lower_name -> (name, province)\nfor row in ws.iter_rows(min_row=2, max_row=ws.max_row, values_only=True):\n    name = str(row[1]).strip() if row[1] else ''\n    province = str(row[3]).strip() if row[3] else ''\n    fd_names[name] = province\n    fd_names_lower[name.lower()] = (name, province)\n\n# Also build a set of all lowercase names and key substrings\nall_fd_lower = set(fd_names_lower.keys())\n\n# 2. Load attachment 1\nwb1 = openpyxl.load_workbook('.reasonix/attachments/clipboard-20260718-154536.448270-000002.xlsx')\nregion_sheets = ['西南地区', '华南地区', '西北地区', '华中地区', '华东地区', '华北地区', '东北地区']\n\norigin_items = []\nfor sname in region_sheets:\n    ws = wb1[sname]\n    for row in ws.iter_rows(min_row=2, max_row=ws.max_row, values_only=True):\n        if row[0] and row[1] and row[2]:\n            origin_items.append({\n                'sheet': sname, 'category': str(row[0]).strip(),\n                'province': str(row[1]).strip(),\n                'variety': str(row[2]).strip(),\n                'area': str(row[3]).strip() if row[3] else '',\n                'season': str(row[4]).strip() if row[4] else '',\n                'notes': str(row[5]).strip() if row[5] else ''\n            })\n\nfor sname in ['哈密瓜', '荔枝']:\n    ws = wb1[sname]\n    for row in ws.iter_rows(min_row=2, max_row=ws.max_row, values_only=True):\n        cat = '哈密瓜' if sname == '哈密瓜' else '荔枝'\n        if sname == '哈密瓜':\n            if row[0] and row[2] and str(row[0]).strip() != '省份':\n                origin_items.append({\n                    'sheet': sname, 'category': cat,\n                    'province': str(row[0]).strip(),\n                    'variety': str(row[2]).strip(),\n                    'area': str(row[1]).strip() if row[1] else '',\n                    'season': str(row[3]).strip() if row[3] else '',\n                    'notes': str(row[4]).strip() if row[4] else ''\n                })\n        else:\n            if row[0] and row[2]:\n                origin_items.append({\n                    'sheet': sname, 'category': cat,\n                    'province': str(row[0]).strip(),\n                    'variety': str(row[2]).strip(),\n                    'area': str(row[1]).strip() if row[1] else '',\n                    'season': str(row[4]).strip() if row[4] else '',\n                    'notes': str(row[5]).strip() if row[5] else ''\n                })\n\ndef split_varieties(text):\n    'Split variety text like 台农、贵妃、金煌 into individual names'\n    # Remove parenthesized content first\n    text = re.sub(r'[（(][^)）]*[)）]', '', text)\n    # Split by common separators\n    parts = re.split(r'[、，,／/]', text)\n    result = []\n    for p in parts:\n        p = p.strip()\n        if not p:\n            continue\n        # Skip phrases that clearly aren't fruit names\n        if p in ['等', '已单独有', '此处不做重复', '品种多']:\n            continue\n        if re.match(r'^\\d+', p):\n            continue\n        result.append(p)\n    return result\n\ndef match_variety(variety_text):\n    'Check if ANY part of the variety text exists in fruit_data'\n    parts = split_varieties(variety_text)\n    unmatched_parts = []\n    matched_parts = []\n    for part in parts:\n        part_lower = part.lower()\n        found = False\n        # Exact match\n        if part in fd_names:\n            matched_parts.append(part)\n            found = True\n        elif part_lower in fd_names_lower:\n            matched_parts.append(part)\n            found = True\n        else:\n            # Partial match: part is substring of fd_name or vice versa\n            for fd_lower, (fd_orig, fdprov) in fd_names_lower.items():\n                if len(part) >= 2 and (part_lower in fd_lower or fd_lower in part_lower):\n                    matched_parts.append(f'{part}≈{fd_orig}')\n                    found = True\n                    break\n        if not found:\n            unmatched_parts.append(part)\n    return unmatched_parts, matched_parts\n\n# Now analyze\ntruly_new = []  # items where NO variety part matches\npartial_new = []  # items where SOME variety parts match\n\nfor item in origin_items:\n    unmatched, matched = match_variety(item['variety'])\n    if not unmatched:\n        continue  # All matched\n    if not matched:\n        # No match at all -> truly new\n        truly_new.append(item)\n    else:\n        # Some matched, some didn't\n        partial_new.append((item, unmatched))\n\nprint(f'Total origin items: {len(origin_items)}')\nprint(f'Items with NO match at all: {len(truly_new)}')\nprint(f'Items with PARTIAL match: {len(partial_new)}')\nprint()\n\nprint('=== TOTALLY NEW ITEMS (no variety matches fruit_data) ===')\nfor item in truly_new:\n    print(f\\\"  [{item['sheet']}] {item['category']} | {item['province']} | {item['variety']}\\\")\n    print(f\\\"       Area: {item['area'][:80]}\\\")\n\nprint()\nprint('=== PARTIALLY MATCHED (some varieties new) ===')\nfor item, unmatched in partial_new:\n    print(f\\\"  [{item['sheet']}] {item['category']} | {item['province']} | {item['variety']}\\\")\n    print(f\\\"       UNMATCHED parts: {unmatched}\\\")\n    print(f\\\"       Area: {item['area'][:80]}\\\")\n\")", "Bash(cd \"C:\\\\fruit-ops\" && python -c \"\nimport openpyxl, sys, io, re, json\nsys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8')\n\n# ======= Step 1: Load fruit_data names ======= \nwb = openpyxl.load_workbook('fruit_data.xlsx')\nws = wb['水果产品库']\n\nfd_names = set()\nfor row in ws.iter_rows(min_row=2, max_row=ws.max_row, values_only=True):\n    name = str(row[1]).strip() if row[1] else ''\n    fd_names.add(name)\n    fd_names.add(name.lower())\n\n# Also add key aliases \naliases_extra = {'巨峰葡萄': '巨峰', '红富士苹果': '红富士', '富士苹果': '红富士', \n                 '嘎啦苹果': '嘎啦', '红提葡萄': '红提'}\n# We'll use these in matching\n\n# ======= Step 2: Load attachment 1 =======\nwb1 = openpyxl.load_workbook('.reasonix/attachments/clipboard-20260718-154536.448270-000002.xlsx')\nregion_sheets = ['西南地区', '华南地区', '西北地区', '华中地区', '华东地区', '华北地区', '东北地区']\n\norigin_items = []\nfor sname in region_sheets:\n    ws = wb1[sname]\n    for row in ws.iter_rows(min_row=2, max_row=ws.max_row, values_only=True):\n        if row[0] and row[1] and row[2]:\n            origin_items.append({\n                'sheet': sname, 'category': str(row[0]).strip(),\n                'province': str(row[1]).strip(),\n                'variety_raw': str(row[2]).strip(),\n                'area': str(row[3]).strip() if row[3] else '',\n                'season': str(row[4]).strip() if row[4] else '',\n                'notes': str(row[5]).strip() if row[5] else ''\n            })\n\nfor sname in ['哈密瓜', '荔枝']:\n    ws = wb1[sname]\n    for row in ws.iter_rows(min_row=2, max_row=ws.max_row, values_only=True):\n        cat = '哈密瓜' if sname == '哈密瓜' else '荔枝'\n        if sname == '哈密瓜':\n            if row[0] and row[2] and str(row[0]).strip() != '省份':\n                origin_items.append({\n                    'sheet': sname, 'category': cat,\n                    'province': str(row[0]).strip(),\n                    'variety_raw': str(row[2]).strip(),\n                    'area': str(row[1]).strip() if row[1] else '',\n                    'season': str(row[3]).strip() if row[3] else '',\n                    'notes': str(row[4]).strip() if row[4] else ''\n                })\n        else:\n            if row[0] and row[2]:\n                origin_items.append({\n                    'sheet': sname, 'category': cat,\n                    'province': str(row[0]).strip(),\n                    'variety_raw': str(row[2]).strip(),\n                    'area': str(row[1]).strip() if row[1] else '',\n                    'season': str(row[4]).strip() if row[4] else '',\n                    'notes': str(row[5]).strip() if row[5] else ''\n                })\n\nprint(f'Loaded {len(origin_items)} origin items')\n\")", "Bash(cd \"C:\\\\fruit-ops\" && python -c \"\nimport openpyxl, sys, io, re, json\nsys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8')\n\n# ======= Step 1: Load fruit_data names =======\nwb = openpyxl.load_workbook('fruit_data.xlsx')\nws = wb['水果产品库']\n\nfd_names = set()\nfd_names_lower = set()\nfor row in ws.iter_rows(min_row=2, max_row=ws.max_row, values_only=True):\n    name = str(row[1]).strip() if row[1] else ''\n    fd_names.add(name)\n    fd_names_lower.add(name.lower())\n\n# ======= Step 2: Load attachment 1 =======\nwb1 = openpyxl.load_workbook('.reasonix/attachments/clipboard-20260718-154536.448270-000002.xlsx')\nregion_sheets = ['西南地区', '华南地区', '西北地区', '华中地区', '华东地区', '华北地区', '东北地区']\n\norigin_items = []\nfor sname in region_sheets:\n    ws = wb1[sname]\n    for row in ws.iter_rows(min_row=2, max_row=ws.max_row, values_only=True):\n        if row[0] and row[1] and row[2]:\n            origin_items.append({\n                'sheet': sname, 'category': str(row[0]).strip(),\n                'province': str(row[1]).strip(),\n                'variety_raw': str(row[2]).strip(),\n                'area': str(row[3]).strip() if row[3] else '',\n                'season': str(row[4]).strip() if row[4] else '',\n                'notes': str(row[5]).strip() if row[5] else ''\n            })\n\nfor sname in ['哈密瓜', '荔枝']:\n    ws = wb1[sname]\n    for row in ws.iter_rows(min_row=2, max_row=ws.max_row, values_only=True):\n        cat = '哈密瓜' if sname == '哈密瓜' else '荔枝'\n        if sname == '哈密瓜':\n            if row[0] and row[2] and str(row[0]).strip() != '省份':\n                origin_items.append({\n                    'sheet': sname, 'category': cat,\n                    'province': str(row[0]).strip(),\n                    'variety_raw': str(row[2]).strip(),\n                    'area': str(row[1]).strip() if row[1] else '',\n                    'season': str(row[3]).strip() if row[3] else '',\n                    'notes': str(row[4]).strip() if row[4] else ''\n                })\n        else:\n            if row[0] and row[2]:\n                origin_items.append({\n                    'sheet': sname, 'category': cat,\n                    'province': str(row[0]).strip(),\n                    'variety_raw': str(row[2]).strip(),\n                    'area': str(row[1]).strip() if row[1] else '',\n                    'season': str(row[4]).strip() if row[4] else '',\n                    'notes': str(row[5]).strip() if row[5] else ''\n                })\n\n# ======= Step 3: Variety matching helper =======\ndef match_single_variety(v):\n    '''Check if a single variety name exists in fd_names'''\n    v = v.strip()\n    if not v or len(v) < 2:\n        return True  # skip short names\n    # Exact\n    if v in fd_names:\n        return True\n    v_lower = v.lower()\n    if v_lower in fd_names_lower:\n        return True\n    # Partial (both directions)\n    for fd_lower in fd_names_lower:\n        if len(v) >= 2 and (v_lower in fd_lower or fd_lower in v_lower):\n            return True\n    # Special aliases\n    aliases = {\n        '巨峰': '巨峰葡萄', '巨峰葡萄': '巨峰',\n        '红富士': '红富士苹果',\n        '嘎啦': '嘎啦', '金煌': '金煌芒',\n        '红提': '红提葡萄',\n        '寒富': '寒富苹果',\n        '国光': '国光苹果',\n        '澳芒': '澳芒',\n        '苹果梨': '苹果梨',\n        '红心脆': '红心脆',\n    }\n    if v_lower in [k.lower() for k in aliases]:\n        for fd_lower in fd_names_lower:\n            if len(v) >= 2 and (v_lower in fd_lower or fd_lower in v_lower):\n                return True\n    return False\n\ndef split_varieties(text):\n    '''Split variety text into individual varieties'''\n    # Remove parenthesized content\n    clean = re.sub(r'[（(][^)）]*[)）]', '', text)\n    parts = re.split(r'[、，,／/；;]', clean)\n    result = []\n    for p in parts:\n        p = p.strip()\n        if not p or p in ['等', '已单独有', '此处不做重复', '品种多']:\n            continue\n        if re.match(r'^\\d', p):\n            continue\n        if p in ['哈密瓜', '荔枝', '苹果', '梨', '葡萄', '芒果', '西瓜']:\n            continue\n        result.append(p)\n    return result\n\n# ======= Step 4: Collect new varieties =======\nnew_entries = []  # each: {variety, province, category, area, season, notes, sheet}\n\nfor item in origin_items:\n    varieties = split_varieties(item['variety_raw'])\n    for v in varieties:\n        if not match_single_variety(v):\n            new_entries.append({\n                'variety': v,\n                'province': item['province'],\n                'category': item['category'],\n                'area': item['area'],\n                'season': item['season'],\n                'notes': item['notes'],\n                'sheet': item['sheet']\n            })\n\nprint(f'New variety entries to export: {len(new_entries)}')\nfor e in new_entries[:20]:\n    print(f\\\"  [{e['sheet']}] {e['category']} | {e['province']} | {e['variety']} | {e['area'][:50]}\\\")\nprint(f'  ... and {len(new_entries)-20} more')\n\")", "Bash(cd \"C:\\\\fruit-ops\" && python -c \"\nimport openpyxl, sys, io, re, json\nsys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8')\n\n# ======= Helper: parse geography from area text =======\ndef parse_geography(province, area_text):\n    '''Try to extract city/county/town from area text'''\n    city = ''\n    county = ''\n    town = ''\n    \n    if not area_text:\n        return city, county, town\n    \n    # Normalize\n    area = area_text.replace('·', '').replace('：', ':').strip()\n    \n    # Pattern 1: XX市XX县/区/市\n    m = re.search(r'([\\u4e00-\\u9fff]{2,6}(?:州|市))([\\u4e00-\\u9fff]{2,6}(?:县|区|市)(?!州))', area)\n    if m:\n        city = m.group(1)\n        county = m.group(2)\n        # Check for town\n        m2 = re.search(r'([\\u4e00-\\u9fff]{2,6}(?:镇|乡))', area[m.end():])\n        if m2:\n            town = m2.group(1)\n        return city, county, town\n    \n    # Pattern 2: XX市 (standalone city with explicit 市)\n    m = re.search(r'([\\u4e00-\\u9fff]{2,6}(?:市))', area)\n    if m:\n        city = m.group(1)\n        # Check for county after\n        rest = area[m.end():]\n        m2 = re.search(r'([\\u4e00-\\u9fff]{2,6}(?:县|区)(?!市))', rest)\n        if m2:\n            county = m2.group(1)\n        return city, county, town\n    \n    # Pattern 3: XX州XX县\n    m = re.search(r'([\\u4e00-\\u9fff]{2,4}州)([\\u4e00-\\u9fff]{2,6}(?:县|市))', area)\n    if m:\n        city = m.group(1)\n        county = m.group(2)\n        return city, county, town\n    \n    # Pattern 4: province level format '湖北·宜昌（秭归）'\n    m = re.search(r'[\\u4e00-\\u9fff]+[·\\\\.]([\\u4e00-\\u9fff]+)', area)\n    if m:\n        city = m.group(1)\n        return city, county, town\n    \n    return city, county, town\n\n# Test\ntests = [\n    ('重庆', '江津区'),\n    ('四川', '丹棱县、蒲江县、名山区'),\n    ('云南', '昭通市昭阳区、鲁甸县'),\n    ('福建', '莆田市（中国枇杷之乡）；漳州市云霄县；福州市福清市'),\n    ('海南', '三亚市；乐东县；陵水县；东方市'),\n    ('广东', '梅州市梅县区、大埔县'),\n    ('湖北', '湖北·宜昌（秭归）'),\n    ('湖南', '湖南·常德（石门）'),\n    ('贵州', '黔南州罗甸县；黔西南州贞丰县'),\n    ('新疆', '阿克苏地区（红旗坡农场、温宿县、阿克苏市）'),\n]\n\nfor prov, area in tests:\n    c, cn, t = parse_geography(prov, area)\n    print(f'{prov} | {area[:40]:40s} -> city={c}, county={cn}, town={t}')\n\")", "Bash(cd \"C:\\\\fruit-ops\" && python -c \"\nimport re, sys, io\nsys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8')\n\ndef parse_geography_v2(province, area_text):\n    city = county = town = ''\n    if not area_text:\n        return city, county, town\n    \n    area = area_text.replace('·', '').replace('：', ':').strip()\n    \n    # Take the FIRST cluster before ； or ；\n    first_cluster = re.split(r'[；;]', area)[0].strip()\n    \n    # Pattern: XX州XX县\n    m = re.search(r'([\\u4e00-\\u9fff]{2,4}州)([\\u4e00-\\u9fff]{2,6}(?:县|市))', first_cluster)\n    if m:\n        city = m.group(1)\n        county = m.group(2)\n        return city, county, town\n    \n    # Pattern: XX地区\n    m = re.search(r'([\\u4e00-\\u9fff]{2,6}地区)', first_cluster)\n    if m:\n        city = m.group(1)\n        rest = first_cluster[m.end():]\n        m2 = re.search(r'([\\u4e00-\\u9fff]{2,6}(?:县|市|区))', rest)\n        if m2:\n            county = m2.group(1)\n        return city, county, town\n    \n    # Pattern: XX市XX县/区\n    m = re.search(r'([\\u4e00-\\u9fff]{2,6}市)([\\u4e00-\\u9fff]{2,6}(?:县|区)(?!市))', first_cluster)\n    if m:\n        city = m.group(1)\n        county = m.group(2)\n        rest = first_cluster[m.end():]\n        m2 = re.search(r'([\\u4e00-\\u9fff]{2,6}(?:镇|乡))', rest)\n        if m2:\n            town = m2.group(1)\n        return city, county, town\n    \n    # Pattern: XX市 (standalone)\n    m = re.search(r'([\\u4e00-\\u9fff]{2,6}市)', first_cluster)\n    if m:\n        city = m.group(1)\n        return city, county, town\n    \n    # Pattern: XX县 (standalone)\n    m = re.search(r'([\\u4e00-\\u9fff]{2,6}县)', first_cluster)\n    if m:\n        county = m.group(1)\n        return city, county, town\n    \n    # Pattern: XX区 (standalone, like 江津区)\n    m = re.search(r'([\\u4e00-\\u9fff]{2,6}区)', first_cluster)\n    if m:\n        county = m.group(1)\n        # Try to infer city from province\n        return city, county, town\n    \n    # Pattern: ProvinceName·CityName format (like 湖北·宜昌)\n    m = re.search(r'[\\u4e00-\\u9fff]+[·\\\\.\\\\-]([\\u4e00-\\u9fff]+)', area)\n    if m:\n        c = m.group(1)\n        # Add 市 suffix if it's a prefecture-level name\n        if not c.endswith(('市', '州', '县', '区', '盟', '地区')):\n            city = c + '市'\n        else:\n            city = c\n        # Check for parenthesized county\n        m2 = re.search(r'[（(]([\\u4e00-\\u9fff]{2,6})[)）]', area)\n        if m2 and not m2.group(1).endswith(('市', '州')):\n            county = m2.group(1) + ('县' if len(m2.group(1)) <= 3 else '')\n        return city, county, town\n    \n    return city, county, town\n\ntests = [\n    ('重庆', '江津区'),\n    ('四川', '丹棱县、蒲江县、名山区'),\n    ('云南', '昭通市昭阳区、鲁甸县'),\n    ('福建', '莆田市（中国枇杷之乡）；漳州市云霄县；福州市福清市'),\n    ('湖北', '湖北·宜昌（秭归）'),\n    ('湖南', '湖南·常德（石门）'),\n    ('贵州', '黔南州罗甸县；黔西南州贞丰县'),\n    ('新疆', '阿克苏地区（红旗坡农场、温宿县、阿克苏市）'),\n    ('辽宁', '辽宁省：大连市（瓦房店市、庄河市）、营口市（盖州市）、葫芦岛市（绥中县）、锦州市'),\n    ('山东', '滨州市沾化区（中国冬枣之乡）；东营市河口区；德州市乐陵市'),\n    ('黑龙江', '黑龙江省：大兴安岭地区（漠河市、呼玛县）；伊春市'),\n]\n\nfor prov, area in tests:\n    c, cn, t = parse_geography_v2(prov, area)\n    print(f'{prov:4s} | {area[:55]:55s} -> city={c:12s} county={cn:10s} town={t}')\n\")", "Bash(cd \"C:\\\\fruit-ops\" && python -c \"\nimport re, sys, io\nsys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8')\n\ndef parse_geography_v3(province, area_text):\n    city = county = town = ''\n    if not area_text:\n        return city, county, town\n    \n    # Normalize：keep · but remove ：→:\n    area = area_text.strip()\n    \n    # First cluster (before ； or ；)\n    first = re.split(r'[；;]', area)[0].strip()\n    # Also try without leading province prefix like '辽宁省：' or '湖北·'\n    first = re.sub(r'^[\\u4e00-\\u9fff]{2,4}[省份]?[：:]', '', first).strip()\n    \n    # Pattern 0: XX·YY（ZZ） like 湖北·宜昌（秭归）\n    m = re.search(r'[\\u4e00-\\u9fff]+[·]([\\u4e00-\\u9fff]+)', first)\n    if m:\n        c = m.group(1)\n        city = (c + '市') if not c[-1] in '市州县区盟' else c\n        m2 = re.search(r'[（(]([\\u4e00-\\u9fff]{2,4})[)）]', first)\n        if m2:\n            cn = m2.group(1)\n            county = (cn + '县') if not cn[-1] in '市县区' else cn\n        return city, county, town\n    \n    # Pattern 1: XX州XX县\n    m = re.search(r'([\\u4e00-\\u9fff]{2,4}州)([\\u4e00-\\u9fff]{2,6}(?:县|市))', first)\n    if m:\n        city, county = m.group(1), m.group(2)\n        return city, county, town\n    \n    # Pattern 2: XX地区\n    m = re.search(r'([\\u4e00-\\u9fff]{2,6}地区)', first)\n    if m:\n        city = m.group(1)\n        rest = first[m.end():]\n        m2 = re.search(r'[\\u4e00-\\u9fff]{2,6}(?:县|市|区)', rest)\n        if m2: county = m2.group(0)\n        return city, county, town\n    \n    # Pattern 3: XX市XX区/县\n    m = re.search(r'([\\u4e00-\\u9fff]{2,6}市)([\\u4e00-\\u9fff]{2,6}(?:区|县))(?!市)', first)\n    if m:\n        city, county = m.group(1), m.group(2)\n        rest = first[m.end():]\n        m2 = re.search(r'([\\u4e00-\\u9fff]{2,6}(?:镇|乡))', rest)\n        if m2: town = m2.group(1)\n        return city, county, town\n    \n    # Pattern 4: standalone XX市\n    m = re.search(r'([\\u4e00-\\u9fff]{2,6}市)', first)\n    if m:\n        city = m.group(1)\n        return city, county, town\n    \n    # Pattern 5: standalone XX县\n    m = re.search(r'([\\u4e00-\\u9fff]{2,6}县)', first)\n    if m:\n        county = m.group(1)\n        return city, county, town\n    \n    # Pattern 6: standalone XX区\n    m = re.search(r'([\\u4e00-\\u9fff]{2,6}区)', first)\n    if m:\n        county = m.group(1)\n        return city, county, town\n    \n    return city, county, town\n\ntests = [\n    ('重庆', '江津区'),\n    ('四川', '丹棱县、蒲江县、名山区'),\n    ('云南', '昭通市昭阳区、鲁甸县'),\n    ('福建', '莆田市（中国枇杷之乡）；漳州市云霄县；福州市福清市'),\n    ('湖北', '湖北·宜昌（秭归）'),\n    ('湖南', '湖南·常德（石门）'),\n    ('贵州', '黔南州罗甸县；黔西南州贞丰县'),\n    ('新疆', '阿克苏地区（红旗坡农场、温宿县、阿克苏市）'),\n    ('辽宁', '辽宁省：大连市（瓦房店市、庄河市）、营口市（盖州市）、葫芦岛市（绥中县）、锦州市'),\n    ('山东', '滨州市沾化区（中国冬枣之乡）；东营市河口区；德州市乐陵市'),\n    ('黑龙江', '黑龙江省：大兴安岭地区（漠河市、呼玛县）；伊春市'),\n    ('海南', '海南·乐东、三亚'),\n    ('浙江', '浙江省：台州市临海市涌泉镇（涌泉蜜桔）；台州市黄岩区；宁波市象山县（红美人）'),\n]\n\nfor prov, area in tests:\n    c, cn, t = parse_geography_v3(prov, area)\n    print(f'{prov:4s} | {area[:55]:55s} -> city={c:12s} county={cn:10s} town={t}')\n\")", "Bash(cd \"C:\\\\fruit-ops\" && python << 'PYEOF'\nimport openpyxl, sys, io, re\nfrom openpyxl.styles import Font, Alignment, PatternFill, Border, Side\nsys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8')\n\n# ==================== HELPERS ====================\n\ndef parse_geography(province, area_text):\n    city = county = town = ''\n    if not area_text:\n        return city, county, town\n    area = area_text.strip()\n    first = re.split(r'[；;]', area)[0].strip()\n    first = re.sub(r'^[\\u4e00-\\u9fff]{2,4}[省份]?[：:]', '', first).strip()\n    \n    # Pattern 0: XX·YY（ZZ）\n    m = re.search(r'[\\u4e00-\\u9fff]+[·]([\\u4e00-\\u9fff]+)', first)\n    if m:\n        c = m.group(1)\n        city = (c + '市') if not c[-1] in '市州县区盟' else c\n        m2 = re.search(r'[（(]([\\u4e00-\\u9fff]{2,4})[)）]', first)\n        if m2:\n            cn = m2.group(1)\n            county = (cn + '县') if not cn[-1] in '市县区' else cn\n        return city, county, town\n    \n    # Pattern 1: XX州XX县\n    m = re.search(r'([\\u4e00-\\u9fff]{2,4}州)([\\u4e00-\\u9fff]{2,6}(?:县|市))', first)\n    if m:\n        city, county = m.group(1), m.group(2)\n        return city, county, town\n    \n    # Pattern 2: XX地区\n    m = re.search(r'([\\u4e00-\\u9fff]{2,6}地区)', first)\n    if m:\n        city = m.group(1)\n        rest = first[m.end():]\n        m2 = re.search(r'[\\u4e00-\\u9fff]{2,6}(?:县|市|区)', rest)\n        if m2: county = m2.group(0)\n        return city, county, town\n    \n    # Pattern 3: XX市XX区/县 (handle XX市XX市 case for county-level city)\n    m = re.search(r'([\\u4e00-\\u9fff]{2,6}市)([\\u4e00-\\u9fff]{2,6}(?:区|县|市))', first)\n    if m:\n        city = m.group(1)\n        county = m.group(2)\n        rest = first[m.end():]\n        m2 = re.search(r'([\\u4e00-\\u9fff]{2,6}(?:镇|乡))', rest)\n        if m2: town = m2.group(1)\n        return city, county, town\n    \n    # Pattern 4: standalone XX市\n    m = re.search(r'([\\u4e00-\\u9fff]{2,6}市)', first)\n    if m:\n        city = m.group(1)\n        rest = first[m.end():]\n        m2 = re.search(r'([\\u4e00-\\u9fff]{2,6}(?:镇|乡))', rest)\n        if m2: town = m2.group(1)\n        return city, county, town\n    \n    # Pattern 5: standalone XX县\n    m = re.search(r'([\\u4e00-\\u9fff]{2,6}县)', first)\n    if m:\n        county = m.group(1)\n        return city, county, town\n    \n    # Pattern 6: standalone XX区\n    m = re.search(r'([\\u4e00-\\u9fff]{2,6}区)', first)\n    if m:\n        county = m.group(1)\n        return city, county, town\n    \n    return city, county, town\n\ndef parse_season(season_text):\n    \"\"\"Parse season text like '10月 - 12月' -> (10, 12)\"\"\"\n    if not season_text:\n        return (0, 0)\n    # Handle \"10月下旬 - 次年3月\" style\n    start_m = None\n    end_m = None\n    \n    # Try: XX月 - XX月\n    m = re.search(r'(\\d+)\\s*月[^\\d]*[-–—~到至]+\\s*[^\\d]*(\\d+)\\s*月', season_text)\n    if m:\n        start_m = int(m.group(1))\n        end_m = int(m.group(2))\n        if '次年' in season_text or start_m > end_m:\n            pass  # cross-year\n        return (start_m, end_m)\n    \n    # \"X月下旬 - 次年X月\"\n    m = re.search(r'(\\d+)\\s*月[^\\d]*次年\\s*(\\d+)\\s*月', season_text)\n    if m:\n        return (int(m.group(1)), int(m.group(2)))\n    \n    # \"X月 - 次年X月\"\n    m = re.search(r'(\\d+)\\s*月[^\\d]*次年\\s*(\\d+)', season_text)\n    if m:\n        return (int(m.group(1)), int(m.group(2)))\n    \n    # Try single month\n    m = re.search(r'(\\d+)\\s*月', season_text)\n    if m:\n        return (int(m.group(1)), int(m.group(1)))\n    \n    return (0, 0)\n\ndef match_fruit_data_single(v):\n    \"\"\"Check if single variety exists in fd_names\"\"\"\n    v = v.strip()\n    if not v or len(v) < 2:\n        return True\n    if v in fd_names:\n        return True\n    v_lower = v.lower()\n    if v_lower in fd_names_lower:\n        return True\n    for fd_lower in fd_names_lower:\n        if len(v) >= 2 and (v_lower in fd_lower or fd_lower in v_lower):\n            return True\n    return False\n\ndef split_varieties(text):\n    clean = re.sub(r'[（(][^)）]*[)）]', '', text)\n    parts = re.split(r'[、，,／/；;]', clean)\n    result = []\n    for p in parts:\n        p = p.strip()\n        if not p or p in ['等', '已单独有', '此处不做重复', '品种多']:\n            continue\n        if re.match(r'^\\d', p):\n            continue\n        # Skip generic category names\n        if p in ['哈密瓜', '荔枝', '苹果', '梨', '葡萄', '芒果', '西瓜', '柑橘', '柑橘类', '柚子', '香蕉', '龙眼', '枇杷', '草莓', '樱桃', '猕猴桃', '石榴', '蓝莓', '枣', '红枣', '柿子', '杨梅', '李子', '桃', '杏', '核桃', '百香果', '火龙果', '圣女果']:\n            continue\n        result.append(p)\n    return result\n\ndef norm_province(p):\n    \"\"\"Normalize province name\"\"\"\n    p = p.strip()\n    # Remove suffixes\n    for s in ['省', '市', '自治区', '壮族', '回族', '维吾尔']:\n        p = p.replace(s, '')\n    return p.strip()\n\n# ==================== LOAD DATA ====================\n\n# Load fruit_data names\nwb = openpyxl.load_workbook('fruit_data.xlsx')\nws = wb['水果产品库']\nfd_names = set()\nfd_names_lower = set()\nfor row in ws.iter_rows(min_row=2, max_row=ws.max_row, values_only=True):\n    name = str(row[1]).strip() if row[1] else ''\n    fd_names.add(name)\n    fd_names_lower.add(name.lower())\n\n# Load attachment 1\nwb1 = openpyxl.load_workbook('.reasonix/attachments/clipboard-20260718-154536.448270-000002.xlsx')\nregion_sheets = ['西南地区', '华南地区', '西北地区', '华中地区', '华东地区', '华北地区', '东北地区']\n\norigin_items = []\nfor sname in region_sheets:\n    ws = wb1[sname]\n    for row in ws.iter_rows(min_row=2, max_row=ws.max_row, values_only=True):\n        if row[0] and row[1] and row[2]:\n            origin_items.append({\n                'sheet': sname, 'category': str(row[0]).strip(),\n                'province': str(row[1]).strip(),\n                'variety_raw': str(row[2]).strip(),\n                'area': str(row[3]).strip() if row[3] else '',\n                'season': str(row[4]).strip() if row[4] else '',\n                'notes': str(row[5]).strip() if row[5] else ''\n            })\n\nfor sname in ['哈密瓜', '荔枝']:\n    ws = wb1[sname]\n    for row in ws.iter_rows(min_row=2, max_row=ws.max_row, values_only=True):\n        cat = '哈密瓜' if sname == '哈密瓜' else '荔枝'\n        if sname == '哈密瓜':\n            if row[0] and row[2] and str(row[0]).strip() != '省份':\n                origin_items.append({\n                    'sheet': sname, 'category': cat,\n                    'province': str(row[0]).strip(),\n                    'variety_raw': str(row[2]).strip(),\n                    'area': str(row[1]).strip() if row[1] else '',\n                    'season': str(row[3]).strip() if row[3] else '',\n                    'notes': str(row[4]).strip() if row[4] else ''\n                })\n        else:\n            if row[0] and row[2]:\n                origin_items.append({\n                    'sheet': sname, 'category': cat,\n                    'province': str(row[0]).strip(),\n                    'variety_raw': str(row[2]).strip(),\n                    'area': str(row[1]).strip() if row[1] else '',\n                    'season': str(row[4]).strip() if row[4] else '',\n                    'notes': str(row[5]).strip() if row[5] else ''\n                })\n\n# ==================== COLLECT NEW ENTRIES ====================\n\nnew_entries = []\nseen = set()  # dedup by (variety, province)\n\nfor item in origin_items:\n    varieties = split_varieties(item['variety_raw'])\n    for v in varieties:\n        if not match_fruit_data_single(v):\n            key = (v, item['province'])\n            if key not in seen:\n                seen.add(key)\n                new_entries.append({\n                    'variety': v,\n                    'province': norm_province(item['province']),\n                    'category': item['category'],\n                    'area': item['area'],\n                    'season_raw': item['season'],\n                    'notes': item['notes'],\n                    'sheet': item['sheet']\n                })\n\nprint(f'Total new entries: {len(new_entries)}')\n\n# ==================== PARSE & BUILD ROWS ====================\n\nrows = []\nfor i, e in enumerate(new_entries):\n    fid = f'N{i+1:03d}'\n    city, county, town = parse_geography(e['province'], e['area'])\n    start_m, end_m = parse_season(e['season_raw'])\n    \n    # Compose product intro\n    intro_parts = []\n    if e['area']:\n        intro_parts.append(f\"主产区：{e['area']}\")\n    if e['season_raw']:\n        intro_parts.append(f\"上市时间：{e['season_raw']}\")\n    if e['notes']:\n        intro_parts.append(f\"运营要点：{e['notes']}\")\n    intro = '；'.join(intro_parts)\n    \n    rows.append([\n        fid, e['variety'], e['category'],\n        e['province'], city, county, town,\n        start_m, end_m, 0, 0,  # 盛产月份暂留空\n        0, 0, 0, 0,  # 农历\n        None, intro\n    ])\n\nprint(f'Built {len(rows)} rows for export')\n\n# ==================== CREATE EXCEL ====================\n\nwb_out = openpyxl.Workbook()\nws_out = wb_out.active\nws_out.title = '水果产品库'\n\n# Header\nheaders = ['水果ID', '水果名称', '水果类别', '省', '市', '县', '乡',\n           '上市月份始', '上市月份末', '盛产开始月', '盛产结束月',\n           '农历产季开始月', '农历产季结束月', '农历盛产开始月', '农历盛产结束月',\n           '成熟度曲线类型', '产品简介']\n\n# Style\nheader_font = Font(name='微软雅黑', bold=True, size=11, color='FFFFFF')\nheader_fill = PatternFill(start_color='2F5496', end_color='2F5496', fill_type='solid')\nheader_align = Alignment(horizontal='center', vertical='center', wrap_text=True)\ncell_font = Font(name='微软雅黑', size=10)\ncell_align = Alignment(vertical='top', wrap_text=True)\nthin_border = Border(\n    left=Side(style='thin'), right=Side(style='thin'),\n    top=Side(style='thin'), bottom=Side(style='thin')\n)\n\nfor col_idx, h in enumerate(headers, 1):\n    cell = ws_out.cell(row=1, column=col_idx, value=h)\n    cell.font = header_font\n    cell.fill = header_fill\n    cell.alignment = header_align\n    cell.border = thin_border\n\nfor row_idx, row_data in enumerate(rows, 2):\n    for col_idx, val in enumerate(row_data, 1):\n        cell = ws_out.cell(row=row_idx, column=col_idx, value=val)\n        cell.font = cell_font\n        cell.alignment = cell_align\n        cell.border = thin_border\n\n# Column widths\ncol_widths = [10, 18, 12, 12, 14, 14, 12, 12, 12, 12, 12, 12, 12, 12, 12, 14, 60]\nfor i, w in enumerate(col_widths, 1):\n    ws_out.column_dimensions[openpyxl.utils.get_column_letter(i)].width = w\n\n# Freeze header\nws_out.freeze_panes = 'A2'\n\n# Add a summary sheet\nws_sum = wb_out.create_sheet('数据来源说明')\nsummary_data = [\n    ['数据来源', '水果产地数据大屏 - 水果产地数据表'],\n    ['对比基准', 'fruit_data.xlsx 水果产品库 (165条)'],\n    ['新增条目数', len(rows)],\n    ['生成时间', '2025年7月'],\n    ['说明', '本表包含水果产地数据表中存在但fruit_data.xlsx产品库中缺失的水果品种。'],\n    ['说明', '每条记录拆分为单个品种。市/县/乡字段从核心主产区文本中尽量解析，解析不出的留空。'],\n    ['说明', '上市月份始/末从上市时间字段解析；盛产月份暂未填写。'],\n    ['数据范围', '包含完全新增品种 + 部分匹配条目中新增的子品种。'],\n]\n\nfor i, (k, v) in enumerate(summary_data, 1):\n    ws_sum.cell(row=i, column=1, value=k).font = Font(name='微软雅黑', bold=True, size=10)\n    ws_sum.cell(row=i, column=2, value=str(v)).font = Font(name='微软雅黑', size=10)\n\nwb_out.save('fruit_data_new_entries.xlsx')\nprint(f'Saved to fruit_data_new_entries.xlsx')\n\n# Print summary\ncats = {}\nfor r in rows:\n    c = r[2]\n    cats[c] = cats.get(c, 0) + 1\nprint('\\nCategory breakdown:')\nfor c, n in sorted(cats.items(), key=lambda x: -x[1]):\n    print(f'  {c}: {n}')\nPYEOF)", "Edit", "Bash(cd \"C:\\\\fruit-ops\" && python compare_and_export.py)", "Bash(cd \"C:\\\\fruit-ops\" && python -c \"\nimport openpyxl, sys, io, json\nsys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8')\n\nwb = openpyxl.load_workbook('fruit_data_new_entries.xlsx')\nprint('Sheets:', wb.sheetnames)\nprint()\n\nws = wb['水果产品库']\nprint(f'水果产品库: {ws.max_row} rows x {ws.max_column} cols')\nprint()\nprint('Header:', [c.value for c in ws[1]])\nprint()\nprint('First 5 data rows:')\nfor row in ws.iter_rows(min_row=2, max_row=min(6, ws.max_row), values_only=True):\n    print(f'  {list(row)[:8]}...')\nprint()\n\n# Print category breakdown\nws_cat = wb['品类分布']\nprint('Category breakdown:')\nfor row in ws_cat.iter_rows(min_row=1, max_row=ws_cat.max_row, values_only=True):\n    if row[0]:\n        print(f'  {row[0]}: {row[1]}')\n\")", "Bash(cd \"C:\\\\fruit-ops\" && python -c \"\nimport openpyxl, sys, io\nsys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8')\n\nwb = openpyxl.load_workbook('fruit_data_new_entries.xlsx')\nws = wb['水果产品库']\n\n# Show sample rows with full data\nprint('Sample entries (all fields):')\nfor row in ws.iter_rows(min_row=2, max_row=min(12, ws.max_row), values_only=True):\n    vals = list(row)\n    print(f\\\"  {vals[0]} | {vals[1]:16s} | {vals[2]:8s} | {vals[3]:4s} | {str(vals[4]):10s} | {str(vals[5]):10s} | start={vals[7]} end={vals[8]}\\\")\n    print(f\\\"       intro: {str(vals[16])[:100]}\\\")\n\n# Check some specific entries\nprint()\nprint('Checking specific entries:')\nfor row in ws.iter_rows(min_row=2, max_row=ws.max_row, values_only=True):\n    vals = list(row)\n    if vals[1] == '巨峰':\n        print(f\\\"  巨峰 | {vals[3]} | start={vals[7]} end={vals[8]} | season_raw check...\\\")\n    if vals[1] == '嘎啦':\n        print(f\\\"  嘎啦 | {vals[3]} | start={vals[7]} end={vals[8]}\\\")\n    if vals[1] == '阿克苏冰糖心苹果':\n        print(f\\\"  阿克苏冰糖心苹果 | start={vals[7]} end={vals[8]} | city={vals[4]} county={vals[5]}\\\")\n\")", "Bash(cd \"C:\\\\fruit-ops\" && python -c \"\nimport openpyxl, sys, io\nsys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8')\n\nwb = openpyxl.load_workbook('fruit_data_new_entries.xlsx')\n\n# Sheet 1: 水果产品库\nws = wb['水果产品库']\nprint(f'=== Sheet: 水果产品库 ({ws.max_row-1} data rows) ===')\n\n# Check for any issues\nempty_city = 0\nempty_county = 0\nzero_end = 0\nfor row in ws.iter_rows(min_row=2, max_row=ws.max_row, values_only=True):\n    vals = list(row)\n    if not vals[4]: empty_city += 1\n    if not vals[5]: empty_county += 1\n    if vals[9] == 0: zero_end += 1\n\nprint(f'  省字段填充率: {ws.max_row-1}/{ws.max_row-1}')\nprint(f'  市字段填充率: {ws.max_row-1-empty_city}/{ws.max_row-1}')\nprint(f'  县字段填充率: {ws.max_row-1-empty_county}/{ws.max_row-1}')\nprint(f'  上市月份始填充率: {ws.max_row-1}/{ws.max_row-1}')\nprint(f'  上市月份末有效(非0)率: {ws.max_row-1-zero_end}/{ws.max_row-1}')\n\n# Show provinces coverage\nprovinces = {}\nfor row in ws.iter_rows(min_row=2, max_row=ws.max_row, values_only=True):\n    p = row[3]\n    provinces[p] = provinces.get(p, 0) + 1\n\nprint(f'\\n  省份覆盖 ({len(provinces)} provinces):')\nfor p, n in sorted(provinces.items(), key=lambda x: -x[1]):\n    print(f'    {p}: {n}条')\n\n# File size\nimport os\nsize = os.path.getsize('fruit_data_new_entries.xlsx')\nprint(f'\\n  文件大小: {size/1024:.1f} KB')\n\")", "Bash(cd \"C:\\\\fruit-ops\" && python -c \"\nimport openpyxl, sys, io\nsys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8')\n\nwb = openpyxl.load_workbook('fruit_data_new_entries.xlsx')\nws = wb['水果产品库']\n\n# Correct index: 7=start_month, 8=end_month\nzero_end = 0\nfor row in ws.iter_rows(min_row=2, max_row=ws.max_row, values_only=True):\n    vals = list(row)\n    if vals[8] == 0 or vals[8] is None:\n        zero_end += 1\n\nprint(f'上市月份末有效(非0)率: {ws.max_row-1-zero_end}/{ws.max_row-1}')\nprint(f'上市月份末为0的数量: {zero_end}')\n\")", "Bash(cd \"C:\\\\fruit-ops\" && rm compare_and_export.py)"]
